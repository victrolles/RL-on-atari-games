
algorithm: dqn

env:
  name: CartPole-v1

network:
  hidden_size: 64

training:
  nb_episodes: 10000
  learning_starts: 10000
  random_steps: 10000
  train_freq: 40
  gradient_steps: 2
  evaluation_interval: 100

replay:
  capacity: 1000
  batch_size: 64

agent:
  learning_rate: 0.01
  gamma: 0.99
  epsilon: 1.0
  epsilon_decay: 0.999
  epsilon_min: 0.01
