
algorithm: sac

env:
  name: CarRacing-v3
  device: cuda
  normalize: true

network:
  hidden_size: 256

training:
  nb_episodes: 1000
  learning_starts: 10000
  random_steps: 10000
  train_freq: 1
  gradient_steps: 1
  evaluation_interval: 25

replay:
  capacity: 50000
  batch_size: 128

agent:
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  log_std_min: -20.0
  log_std_max: 2.0

logging:
  run_dir: ./runs
  wandb_project: atari-rl
