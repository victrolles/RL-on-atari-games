algorithm: sac

env:
  name: BipedalWalker-v3
  device: cuda
  normalize: false

network:
  hidden_size: 512

training:
  nb_episodes: 1000
  learning_starts: 10000
  random_steps: 10000
  train_freq: 1
  gradient_steps: 2

evaluation:
  nb_episodes: 1
  nb_interval: 40

replay:
  capacity: 300000
  batch_size: 256

agent:
  actor_lr: 0.0003
  critic_lr: 0.0006
  alpha_lr: 0.0006
  gamma: 0.99
  tau: 0.005
  alpha: 0.2

logging:
  checkpoint_interval: 100