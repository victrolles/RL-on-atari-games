algorithm: sac

env:
  name: BipedalWalker-v3
  device: cuda
  normalize: false

network:
  hidden_size: 512

training:
  nb_episodes: 5000
  learning_starts: 10000
  random_steps: 10000
  train_freq: 64
  gradient_steps: 64
  evaluation_interval: 30

replay:
  capacity: 300000
  batch_size: 256

agent:
  actor_lr: 0.00073
  critic_lr: 0.00073
  alpha_lr: 0.00073
  gamma: 0.98
  tau: 0.02
  alpha: 0.2